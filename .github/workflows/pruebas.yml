name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar el paquete
        run: pip install -e ".[app]"
      - name: Ejecutar la batería de pruebas
        run: python -m unittest discover -s tests -v
      - name: Recorrer la demostración por la línea de órdenes
        run: |
          memoria demo /tmp/demo
          memoria corregir /tmp/demo verificar
          memoria consultar /tmp/demo "¿Qué ocurrió en Puerto Arenal en 1991?"

  nucleo-sin-dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El núcleo funciona solo con la biblioteca estándar
        run: |
          pip install --no-deps -e .
          python -m unittest discover -s tests
