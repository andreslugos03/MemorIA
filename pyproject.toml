[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-ia"
dynamic = ["version"]
description = "Auditoría situada de modelos de lenguaje y asistente de consulta para archivos testimoniales del conflicto armado colombiano"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andrés David Correa Lugos", email = "andreslugos03@gmail.com" }]
keywords = ["humanidades digitales", "memoria histórica", "auditoría algorítmica", "modelos de lenguaje", "RAG", "Colombia", "epistemicidio algorítmico"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Spanish",
  "Intended Audience :: Science/Research",
  "Topic :: Sociology :: History",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.67"]

[project.urls]
Repositorio = "https://github.com/andreslugos03/MemorIA"
ORCID = "https://orcid.org/0000-0002-6477-8001"

[project.scripts]
memoria = "memoria.cli:main"

[tool.setuptools.dynamic]
version = { attr = "memoria.__version__" }

[tool.setuptools.packages.find]
include = ["memoria*"]

[tool.setuptools.package-data]
memoria = ["datos_demo/*.json", "datos_demo/*/*.csv", "datos_demo/*/*.jsonl", "app/*.py", "app/*.toml"]
